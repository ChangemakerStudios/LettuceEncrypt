name: CI

# Cross-platform build, format check and test coverage. Packaging and publishing live in
# deploy.yml, which versions with GitVersion.

on:
  push:
    branches-ignore:
      - dependabot/*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
      - name: Run build script
        run: ./build.ps1 -ci
      - uses: codecov/codecov-action@v4
        with:
          name: unittests-${{ matrix.os }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
