# Versions are derived from git history rather than hard-coded in the project files.
#
# next-version is set explicitly because this repository has no version tags yet, and without one
# GitVersion starts from 0.1.0 -- lower than the 1.3.4-beta.5 builds already published. Once a
# v1.3.5 tag exists this line can be removed and versions come from tags alone.
#
# In ContinuousDelivery mode every commit on main between tags produces the same version, so the
# release workflow pushes with --skip-duplicate and only the first one publishes. Tag a commit to
# release the next version.
mode: ContinuousDelivery
next-version: 1.3.5
branches: {}
ignore:
  sha: []
merge-message-formats: {}
